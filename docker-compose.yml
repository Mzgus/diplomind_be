services:
  db:
    image: postgres
    restart: always
    shm_size: 128mb
    volumes:
      - ./mig:/docker-entrypoint-initdb.d/:ro
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: $POSTGRES_DB
    ports:
      - "2345:2345"
    
volumes:
  pg_data:
    name: diplomind