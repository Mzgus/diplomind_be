services:
  db:
    build:
      context: .
      dockerfile: dockerfile.db
    container_name: diplomind_db
    restart: always
    shm_size: 128mb
    volumes:
      - pg_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: $POSTGRES_DB
    # ports:
    #   - "5432:5432"
    networks:
      - diplomind_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: 
      context: .
      dockerfile: dockerfile.api
    container_name: diplomind_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@db:5432/$POSTGRES_DB
      JWT_SECRET: $JWT_SECRET
      COOKIE_NAME: $COOKIE_NAME
    ports:
      - "3000:3000"
    networks:
      - diplomind_network
    
volumes:
  pg_data:
    name: diplomind

networks:
  diplomind_network:
    name: diplomind_network